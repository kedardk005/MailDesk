server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — the audit flagged that nothing was compressed anywhere.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed build assets are immutable; index.html must never be cached or
    # users get a stale shell pointing at deleted chunks after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: React Router owns all non-asset paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers. CSP is intentionally strict on framing:
    # untrusted email HTML is rendered in a sandboxed iframe with srcDoc.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
